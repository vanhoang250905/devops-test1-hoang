
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins HTML Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 80px 20px;
        }
        .card {
            max-width: 500px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px #0001;
        }
        h1 { color: #2563eb; }
        button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Jenkins CI/CD Demo</h1>
        <p>Website HTML đang hoạt động!</p>
        <p id="status">Chưa kiểm tra.</p>
        <button onclick="checkStatus()">Kiểm tra</button>
    </div>

    <script>
        function checkStatus() {
            document.getElementById("status").textContent =
                "Build và kiểm thử giao diện thành công!";
        }
    </script>
</body>
</html>
